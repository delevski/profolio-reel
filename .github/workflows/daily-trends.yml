name: Daily AI Trends

on:
  schedule:
    # ~07:00 Israel time (UTC+3). GitHub cron can drift by ~15 minutes.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      regenerate_date:
        description: "Optional. Rebuild the post (article, Hebrew, cover) for an EXISTING digest date, e.g. 2026-11-10. Leave empty for a normal run."
        required: false
        default: ""
        type: string

# The job commits the day's digest + blog post back to main (built-in token, no extra secret).
permissions:
  contents: write

concurrency:
  group: daily-trends
  cancel-in-progress: false

jobs:
  daily-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run daily trends pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Rate-limit handling (all optional, sane defaults in scripts/lib/llm.ts). Models are repo
          # *variables* (Settings -> Secrets and variables -> Actions -> Variables), not secrets.
          MISTRAL_MODEL_SUMMARY: ${{ vars.MISTRAL_MODEL_SUMMARY }}
          MISTRAL_MODEL_ARTICLE: ${{ vars.MISTRAL_MODEL_ARTICLE }}
          MISTRAL_MODEL_TRANSLATE: ${{ vars.MISTRAL_MODEL_TRANSLATE }}
          MISTRAL_MIN_INTERVAL_MS: ${{ vars.MISTRAL_MIN_INTERVAL_MS }}
          # Optional fallback when Mistral stays rate-limited: Anthropic. Absent = Mistral only.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          # Empty on the schedule; a YYYY-MM-DD from "Run workflow" regenerates that day's post.
          REGENERATE_DATE: ${{ github.event.inputs.regenerate_date }}
          # Optional cover-image provider (first one present is used). With none set, every
          # post still gets a branded cover drawn in code. Recommended: FAL_KEY (about $0.003/image).
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Built-in token (not a new secret): lets the job read project READMEs without rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_EMAIL: ordi21@walla.co.il
          SITE_URL: https://ordelwebsite.vercel.app
          RESEND_FROM: AI Trends Digest <onboarding@resend.dev>
        run: npm run trends:daily

      - name: Commit digest to main
        run: |
          git config user.name "daily-trends[bot]"
          git config user.email "daily-trends@users.noreply.github.com"
          git add content/ai-trends content/blog content/trends.json public/blog/ai-trends
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "chore(trends): daily AI trends digest $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::error::Could not push the digest commit"
          exit 1
