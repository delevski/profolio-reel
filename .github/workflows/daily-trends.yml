name: Daily AI Trends

on:
  schedule:
    # ~07:00 Israel time (UTC+3). GitHub cron can drift by ~15 minutes.
    - cron: "0 4 * * *"
  workflow_dispatch:

# The job commits the day's digest + blog post back to main (built-in token, no extra secret).
permissions:
  contents: write

concurrency:
  group: daily-trends
  cancel-in-progress: false

jobs:
  daily-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run daily trends pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_EMAIL: ordi21@walla.co.il
          SITE_URL: https://ordelwebsite.vercel.app
          RESEND_FROM: AI Trends Digest <onboarding@resend.dev>
        run: npm run trends:daily

      - name: Commit digest to main
        run: |
          git config user.name "daily-trends[bot]"
          git config user.email "daily-trends@users.noreply.github.com"
          git add content/ai-trends content/blog content/trends.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "chore(trends): daily AI trends digest $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::error::Could not push the digest commit"
          exit 1
